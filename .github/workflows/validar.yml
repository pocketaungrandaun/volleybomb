name: Validar módulos e pacote
on:
  push:
    branches: [main, refactor/modulos]
  pull_request:

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar script gerado
        run: python3 tools/build.py --check
      - name: Validar Lua do seletor visual
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          luac5.4 -p tools/VolleyBomb_ObjectLogger.lua
